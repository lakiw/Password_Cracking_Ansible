---
# This playbook contains general tasks to update and harden the
# operating system

- name: Remove old NVidia signing key
  become: true
  ansible.builtin.apt_key:
    id: 7fa2af80
    state: absent

- name: remove ppa
  apt_repository:
    repo: ppa:graphics-drivers/ppa
    state: absent

- name: Install a NVidia driver keyring from the internet.
  become: true
  ansible.builtin.apt:
    deb: "https://developer.download.nvidia.com/compute/cuda/repos/{{ ansible_distribution|lower }}2404/{{ ansible_architecture }}/cuda-keyring_1.1-1_all.deb"
    state: present

- name: Install and Updgrade NVidia driver
  block:
    - name: Install nvidia-open drivers
      become: true
      ansible.builtin.apt:
        name: nvidia-open
        update_cache: yes

  rescue:
    # Nvidia drivers tend to not upgrade gracefully, so its easier to remove then re-add
    - name: Purge all NVIDIA packages
      become: true
      ansible.builtin.apt:
        name: "^nvidia-.*"
        state: absent
        purge: yes
        autoremove: no
        update_cache: no
      ignore_errors: yes

    - name: Autoremove unused packages after NVIDIA purge
      become: true
      ansible.builtin.apt:
        autoremove: yes
    
    - name: Give hint to future me when this fails again
      ansible.builtin.debug:
        msg: "You may need to run 'apt --fix-broken install' TWICE to fully remove and fix previous driver installs"

    - name: 2nd try - Install nvidia-open drivers
      become: true
      ansible.builtin.apt:
        name: nvidia-open
        update_cache: no

- name: Install cuda drivers
  become: true
  ansible.builtin.apt:
    name: cuda-drivers
    update_cache: no

